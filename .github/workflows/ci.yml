# BandQQ CI —— 推送/PR 自动验证与出包
#
# 说明（为什么没有 gradlew）：
#   仓库走 gradle/actions/setup-gradle 直接安装 Gradle 8.13（与 gradle-wrapper.properties
#   同版本），无需提交 wrapper 二进制。
#
# 两个并行 job：
#   rpk —— band-qq 四分支快应用包（band/bandpro/xiaomis/redmiwatch）+ node 单测
#   apk —— android-sync 双 flavor（bundled/companion）单测 + Debug 出包
#
# 签名：keystore.jks 与 band-qq/sign/release/*.pem 均已入库，CI 直接签名，无需 secrets。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rpk:
    name: rpk 四分支打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: band-qq/package-lock.json

      - name: 安装依赖
        working-directory: band-qq
        run: npm ci

      - name: node 单元测试
        working-directory: band-qq
        run: npm test

      - name: 四分支打包（band / bandpro / xiaomis / redmiwatch）
        working-directory: band-qq
        run: node tools/branch-release.js

      - name: 上传 rpk 产物
        uses: actions/upload-artifact@v4
        with:
          name: bandqq-rpk
          path: band-qq/dist-branch/*.rpk
          retention-days: 14
          if-no-files-found: error

  apk:
    name: APK 双 flavor 测试构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # 平台 37 目录陷阱：sdkmanager 装出 platforms/android-37.0，AGP 只认 android-37
      # （scripts/setup-buildenv.sh 第 5 步同款手术，本地已验证）
      - name: 安装 SDK 组件并修复 android-37 目录名
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" >/dev/null
          P="$ANDROID_HOME/platforms"
          if [ -d "$P/android-37.0" ] && [ ! -d "$P/android-37" ]; then
            mv "$P/android-37.0" "$P/android-37"
            sed -i 's|path="platforms;android-37.0"|path="platforms;android-37"|' "$P/android-37/package.xml"
            sed -i 's|AndroidVersion.ApiLevel=37.0|AndroidVersion.ApiLevel=37|' "$P/android-37/source.properties"
          fi
          ls "$P"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: 单元测试 + 双 flavor Debug 出包
        working-directory: android-sync
        run: gradle --no-daemon --max-workers=2 test assembleBundledDebug assembleCompanionDebug

      - name: 上传测试报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-test-reports
          path: android-sync/app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: bandqq-apk-debug
          path: android-sync/app/build/outputs/apk/*/debug/*.apk
          retention-days: 14
          if-no-files-found: error
