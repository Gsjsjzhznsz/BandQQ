# BandQQ CI —— 推送/PR 自动验证与出包
#
# 说明（为什么没有 gradlew）：
#   仓库走 gradle/actions/setup-gradle 直接安装 Gradle 8.13（与 gradle-wrapper.properties
#   同版本），无需提交 wrapper 二进制。
#
# 两个并行 job：
#   rpk —— band-qq 四分支快应用包（band/bandpro/xiaomis/redmiwatch）+ node 单测
#   apk —— android-sync 双 flavor（bundled/companion）单测 + Debug 出包
#
# 签名：keystore.jks 与 band-qq/sign/release/*.pem 均已入库，CI 直接签名，无需 secrets。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rpk:
    name: rpk 四分支打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: band-qq/package-lock.json

      - name: 安装依赖
        working-directory: band-qq
        run: npm ci

      - name: node 单元测试
        working-directory: band-qq
        run: npm test

      - name: 四分支打包（band / bandpro / xiaomis / redmiwatch）
        working-directory: band-qq
        run: node tools/branch-release.js

      - name: 上传 rpk 产物
        uses: actions/upload-artifact@v4
        with:
          name: bandqq-rpk
          path: band-qq/dist-branch/*.rpk
          retention-days: 14
          if-no-files-found: error

  apk:
    name: APK 双 flavor 测试构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 配方（本地 e2e 验证，与 scripts/setup-buildenv.sh 同源思路）：
      # Google 官方 platform-37.0 zip 元数据自带笔误（<api-level>37.0 / Platform.Version=17），
      # AGP 8.13.2 按 hash 串 android-37 查平台必报 Failed to find target——四处补丁：
      #   package.xml: path=platforms;android-37.0→37 + <api-level>37.0→37（后者是根因）
      #   source.properties: ApiLevel 37.0→37 + Platform.Version 17→37
      # 四跑实测：镜像预装的 android-37 未修元数据，sdkmanager 认 AGP 不认。
      - name: 安装 SDK 并修复 android-37 元数据笔误
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          LOG="${RUNNER_TEMP}/sdk-install.log"
          yes | "$SDKM" --licenses >> "$LOG" 2>&1 || true
          yes | "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" >> "$LOG" 2>&1 || true
          P="$ANDROID_HOME/platforms"
          if [ -d "$P/android-37.0" ]; then
            rm -rf "$P/android-37"   # 镜像预装的同名目录元数据未修，弃用
            mv "$P/android-37.0" "$P/android-37"
            sed -i 's|platforms;android-37\.0|platforms;android-37|g; s|<api-level>37\.0</api-level>|<api-level>37</api-level>|' "$P/android-37/package.xml"
            sed -i 's|AndroidVersion.ApiLevel=37\.0|AndroidVersion.ApiLevel=37|; s|Platform\.Version=17|Platform.Version=37|' "$P/android-37/source.properties"
          fi
          if [ ! -d "$P/android-37" ]; then
            echo "sdkmanager 装包失败，走官方 zip 直装兜底"
            curl -sSL -o "${RUNNER_TEMP}/p37.zip" "https://dl.google.com/android/repository/platform-37.0_r02.zip"
            unzip -q "${RUNNER_TEMP}/p37.zip" -d "${RUNNER_TEMP}/p37"
            rm -rf "$P/android-37" "$P/android-37.0"
            mv "${RUNNER_TEMP}/p37/android-37.0" "$P/android-37"
            sed -i 's|AndroidVersion.ApiLevel=37\.0|AndroidVersion.ApiLevel=37|; s|Platform\.Version=17|Platform.Version=37|' "$P/android-37/source.properties"
            cat > "$P/android-37/package.xml" << 'XMLEOF'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?><ns2:repository xmlns:ns2="http://schemas.android.com/repository/android/common/02" xmlns:ns11="http://schemas.android.com/sdk/android/repo/repository2/03"><localPackage path="platforms;android-37" obsolete="false"><type-details xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:type="ns11:platformDetailsType"><api-level>37</api-level><codename></codename><extension-level>22</extension-level><base-extension>true</base-extension><layoutlib api="15"/></type-details><revision><major>2</major></revision><display-name>Android SDK Platform 37</display-name><uses-license ref="android-sdk-license"/></localPackage></ns2:repository>
          XMLEOF
          fi
          echo "--- 校验 ---"
          ls "$P" | grep 37 || true
          [ -f "$P/android-37/android.jar" ] || { tail -40 "$LOG"; echo "::error::android-37 缺 android.jar"; exit 1; }
          grep -q '<api-level>37</api-level>' "$P/android-37/package.xml" || { echo "::error::package.xml api-level 未修正"; exit 1; }
          grep -q 'AndroidVersion.ApiLevel=37$' "$P/android-37/source.properties" || { echo "::error::source.properties 未修正"; exit 1; }
          echo "platform android-37 ready"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: 单元测试 + 双 flavor Debug 出包
        working-directory: android-sync
        run: gradle --no-daemon --max-workers=2 test assembleBundledDebug assembleCompanionDebug

      - name: 上传测试报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-test-reports
          path: android-sync/app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: bandqq-apk-debug
          path: android-sync/app/build/outputs/apk/*/debug/*.apk
          retention-days: 14
          if-no-files-found: error
