# BandQQ CI —— 推送/PR 自动验证与出包
#
# 说明（为什么没有 gradlew）：
#   仓库走 gradle/actions/setup-gradle 直接安装 Gradle 8.13（与 gradle-wrapper.properties
#   同版本），无需提交 wrapper 二进制。
#
# 两个并行 job：
#   rpk —— band-qq 四分支快应用包（band/bandpro/xiaomis/redmiwatch）+ node 单测
#   apk —— android-sync 双 flavor（bundled/companion）单测 + Debug 出包
#
# 签名：keystore.jks 与 band-qq/sign/release/*.pem 均已入库，CI 直接签名，无需 secrets。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rpk:
    name: rpk 四分支打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: band-qq/package-lock.json

      - name: 安装依赖
        working-directory: band-qq
        run: npm ci

      - name: node 单元测试
        working-directory: band-qq
        run: npm test

      - name: 四分支打包（band / bandpro / xiaomis / redmiwatch）
        working-directory: band-qq
        run: node tools/branch-release.js

      - name: 上传 rpk 产物
        uses: actions/upload-artifact@v4
        with:
          name: bandqq-rpk
          path: band-qq/dist-branch/*.rpk
          retention-days: 14
          if-no-files-found: error

  apk:
    name: APK 双 flavor 测试构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest 自带 Android SDK（不用 android-actions/setup-android@v3，
      # 其 license 交互对新出 preview 协议会卡死，首跑实测 failed）。
      # cmdline-tools 锁定本地验证过的 11076708（scripts/setup-buildenv.sh 同源配方）——
      # 第二跑实测 runner 自带 latest 的注册表行为不同：目录改名后 AGP 仍按
      # package.xml 的 path 注册表找 target，报 "Failed to find target android-37"。
      # 平台 37 目录陷阱：sdkmanager 装出 platforms/android-37.0，AGP 只认 android-37。
      - name: 安装 SDK 组件并修复 android-37 目录名
        run: |
          CT="${RUNNER_TEMP}/cmdtools"
          curl -sSL -o "${RUNNER_TEMP}/ct.zip" "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          rm -rf "$CT"; unzip -q "${RUNNER_TEMP}/ct.zip" -d "$CT"
          SDKM="$CT/cmdline-tools/bin/sdkmanager"
          LOG="${RUNNER_TEMP}/sdk-install.log"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --install "build-tools;37.0.0" "platform-tools" >> "$LOG" 2>&1 || true
          P="$ANDROID_HOME/platforms"
          # 镜像预装的 android-37（连同 37.1/37.2-beta）注册表 schema 与 AGP 8.13.2 不兼容：
          # 三跑实证 sdkmanager --list_installed 认，AGP 仍报 Failed to find target
          # 'android-37'。卸掉预装，用锁版工具全新重装重建注册表（本地验证过的状态）。
          if [ -d "$P/android-37" ]; then
            yes | "$SDKM" --sdk_root="$ANDROID_HOME" --uninstall "platforms;android-37" >> "$LOG" 2>&1 || true
            rm -rf "$P/android-37"
          fi
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --install "platforms;android-37" >> "$LOG" 2>&1 || true
          if [ ! -d "$P/android-37" ]; then
            # 上游无非 minor 包名时走 37.0 + 目录手术
            yes | "$SDKM" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" >> "$LOG" 2>&1 || true
            [ -d "$P/android-37.0" ] && [ ! -d "$P/android-37" ] && mv "$P/android-37.0" "$P/android-37"
            for F in "$P/android-37/package.xml" "$P/android-37/source.properties"; do
              [ -f "$F" ] && sed -i 's|platforms;android-37\.0|platforms;android-37|g; s|AndroidVersion.ApiLevel=37\.0|AndroidVersion.ApiLevel=37|' "$F"
            done
          fi
          echo "--- 平台目录 ---"; ls "$P" || true
          echo "--- package.xml 头部 ---"; head -25 "$P/android-37/package.xml" || true
          echo "--- source.properties ---"; cat "$P/android-37/source.properties" || true
          echo "--- 注册表核对 ---"; "$SDKM" --sdk_root="$ANDROID_HOME" --list_installed 2>/dev/null | grep -i "android-37" || true
          PX="$P/android-37/package.xml"
          if [ ! -f "$PX" ] || ! grep -q 'platforms;android-37"' "$PX"; then
            tail -40 "$LOG"
            echo "::error::android-37 平台注册表校验失败"
            exit 1
          fi
          echo "platform android-37 ready"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: 单元测试 + 双 flavor Debug 出包
        working-directory: android-sync
        run: gradle --no-daemon --max-workers=2 test assembleBundledDebug assembleCompanionDebug

      - name: 上传测试报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-test-reports
          path: android-sync/app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: bandqq-apk-debug
          path: android-sync/app/build/outputs/apk/*/debug/*.apk
          retention-days: 14
          if-no-files-found: error
