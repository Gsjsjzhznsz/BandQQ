# BandQQ CI —— 推送/PR 自动验证与出包
#
# 构建链（v2.25.1 起）：AGP 9.0.1 + Gradle 9.1.0 + JDK 17
#   AGP 9 内置 Kotlin 支持（无需 KGP android 插件）；compileSdk 37 走
#   compileSdkMinor=0 语义，直接命中 sdkmanager 原生 platforms;android-37.0，
#   无需任何元数据补丁（此前 AGP 8.13.2 的 sdklib 解析不了 minor 版本 API 打包，
#   系列失败复盘见 git log 十轮定位记录）。
#
# 两个并行 job：
#   rpk —— band-qq 四分支快应用包（band/bandpro/xiaomis/redmiwatch）+ node 单测
#   apk —— android-sync 双 flavor（bundled/companion）单测 + Debug 出包
#
# 签名：keystore.jks 与 band-qq/sign/release/*.pem 均已入库，CI 直接签名，无需 secrets。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rpk:
    name: rpk 四分支打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: band-qq/package-lock.json

      - name: 安装依赖
        working-directory: band-qq
        run: npm ci

      - name: node 单元测试
        working-directory: band-qq
        run: npm test

      - name: 四分支打包（band / bandpro / xiaomis / redmiwatch）
        working-directory: band-qq
        run: node tools/branch-release.js

      - name: 上传 rpk 产物
        uses: actions/upload-artifact@v4
        with:
          name: bandqq-rpk
          path: band-qq/dist-branch/*.rpk
          retention-days: 14
          if-no-files-found: error

  apk:
    name: APK 双 flavor 测试构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk）
      - name: 安装 SDK 组件
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          yes | "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0" "build-tools;35.0.0" "platform-tools" >/dev/null
          [ -d "$ANDROID_HOME/platforms/android-37.0" ] && echo "platforms;android-37.0 ok"
          [ -d "$ANDROID_HOME/build-tools/37.0.0" ] && echo "build-tools;37.0.0 ok"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: 单元测试 + 双 flavor Debug 出包
        working-directory: android-sync
        run: gradle --no-daemon --max-workers=2 test assembleBundledDebug assembleCompanionDebug

      - name: 上传测试报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-test-reports
          path: android-sync/app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

      - name: 上传 APK 产物（改名 bandqq-<版本>-<flavor>.apk）
        uses: actions/upload-artifact@v4
        with:
          name: bandqq-apk-debug
          path: android-sync/app/build/outputs/apk/*/debug/*.apk
          retention-days: 14
          if-no-files-found: error
