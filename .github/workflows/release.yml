# BandQQ Release —— 打 tag（v*）自动构建正式包并发 GitHub Release
#
# 触发：
#   git tag v2.25.1 && git push origin v2.25.1   → 构建并发版
#   手动 workflow_dispatch                        → 只出包存 artifact，不发 Release
#
# 版本校验：tag 必须与 android-sync/app/build.gradle.kts 的 versionName 一致，防止发错版本。
# 产物（与历史 Release 资产一致）：
#   bandqq-<版本>-bundled.apk      胖包（内嵌引擎）
#   bandqq-<版本>-companion.apk    瘦包（伴侣版）
#   bandqq-{band,bandpro,xiaomis,redmiwatch}-<版本>.rpk  四分支快应用包

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    name: 构建正式包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tag 与 versionName 一致性校验
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[0-9.]+' android-sync/app/build.gradle.kts | head -1)
          echo "versionName=$V, tag=${GITHUB_REF}"
          if [ "${GITHUB_REF}" != "refs/tags/v${V}" ]; then
            echo "::error::tag ${GITHUB_REF} 与 versionName v${V} 不一致，请先对齐 app/build.gradle.kts"
            exit 1
          fi

      # ---------- APK ----------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 配方（本地 e2e 验证 · 清空重建版）：
      # 七跑实证：平台元数据与本地逐字节一致仍 "Failed to find target android-37"，
      # 唯一剩余差异 = 镜像预装 SDK 树中的其它包（34-ext*/35-ext*/36-ext*/XR 等），
      # AGP 8.13.2 内置 sdklib 全树扫描 package.xml 时任何一个 schema 不兼容包
      # 都可能中断注册表构建。故：清空镜像 SDK 树，按本地验证过的五件套重建
      # （zip 直解 cmdline-tools + platform-tools + build-tools 37.0.0 + 平台 37）。
      # 平台元数据四处补丁：Google 官方 zip 自带笔误 api-level 37.0 / Platform.Version=17。
      - name: 清空重建 SDK（本地验证五件套）
        run: |
          set -x
          LOG="${RUNNER_TEMP}/sdk-install.log"
          # 1) 清空镜像预装（licenses 保留，accepted 标记仍有效）
          rm -rf "$ANDROID_HOME"/platforms "$ANDROID_HOME"/build-tools "$ANDROID_HOME"/add-ons \
                 "$ANDROID_HOME"/system-images "$ANDROID_HOME"/extras "$ANDROID_HOME"/sources \
                 "$ANDROID_HOME"/cmdline-tools "$ANDROID_HOME"/tools "$ANDROID_HOME"/patches
          # 2) cmdline-tools：zip 直解（无 package.xml，与本地一致）
          curl -sSL -o "$RUNNER_TEMP/ct.zip" "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          mkdir -p "$ANDROID_HOME/cmdline-tools" "$RUNNER_TEMP/ctx"
          rm -rf "$RUNNER_TEMP/ctx"; unzip -q "$RUNNER_TEMP/ct.zip" -d "$RUNNER_TEMP/ctx"
          mv "$RUNNER_TEMP/ctx/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses >> "$LOG" 2>&1 || true
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --install "platform-tools" "build-tools;37.0.0" >> "$LOG" 2>&1 || true
          # 3) 平台 37：临时 sdk_root 装出（sdkmanager 写注册表）→ 落位
          rm -rf "$RUNNER_TEMP/sdktmp"
          yes | "$SDKM" --sdk_root="$RUNNER_TEMP/sdktmp" --licenses >> "$LOG" 2>&1 || true
          yes | "$SDKM" --sdk_root="$RUNNER_TEMP/sdktmp" --install "platforms;android-37.0" >> "$LOG" 2>&1 || true
          P="$ANDROID_HOME/platforms"; mkdir -p "$P"
          rm -rf "$P/android-37" "$P/android-37.0"
          if [ -d "$RUNNER_TEMP/sdktmp/platforms/android-37.0" ]; then
            mv "$RUNNER_TEMP/sdktmp/platforms/android-37.0" "$P/android-37"
          else
            echo "sdkmanager 装包失败，走官方 zip 直装兜底"
            curl -sSL -o "$RUNNER_TEMP/p37.zip" "https://dl.google.com/android/repository/platform-37.0_r02.zip"
            unzip -q "$RUNNER_TEMP/p37.zip" -d "$RUNNER_TEMP/p37"
            mv "$RUNNER_TEMP/p37/android-37.0" "$P/android-37"
          fi
          # 4) 元数据四处补丁 + 验证版注册表覆盖（逐字节对齐本地成功状态）
          sed -i 's|platforms;android-37\.0|platforms;android-37|g; s|<api-level>37\.0</api-level>|<api-level>37</api-level>|' "$P/android-37/package.xml" || true
          sed -i 's|AndroidVersion.ApiLevel=37\.0|AndroidVersion.ApiLevel=37|; s|Platform\.Version=17|Platform.Version=37|' "$P/android-37/source.properties"
          if [ -f "$P/android-37/package.xml" ]; then
            cp "$GITHUB_WORKSPACE/.github/sdk/platforms-android-37.package.xml" "$P/android-37/package.xml"
          fi
          # 5) 硬校验
          echo "--- SDK 树 ---"; ls "$ANDROID_HOME"; ls "$P"
          echo "--- 注册表关键行 ---"
          grep -o 'path="[^"]*"' "$P/android-37/package.xml" | head -2 || true
          grep -o '<api-level>[^<]*</api-level>' "$P/android-37/package.xml" || true
          echo "--- source.properties ---"; cat "$P/android-37/source.properties" || true
          [ -f "$P/android-37/android.jar" ] || { tail -40 "$LOG"; echo "::error::android-37 缺 android.jar"; exit 1; }
          grep -q '<api-level>37</api-level>' "$P/android-37/package.xml" || { echo "::error::package.xml api-level 未修正"; exit 1; }
          grep -q 'AndroidVersion.ApiLevel=37$' "$P/android-37/source.properties" || { echo "::error::source.properties 未修正"; exit 1; }
          echo "platform android-37 ready"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: 单元测试 + 双 flavor Release 出包
        working-directory: android-sync
        run: gradle --no-daemon --max-workers=2 --stacktrace test assembleBundledRelease assembleCompanionRelease

      # ---------- rpk ----------
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: band-qq/package-lock.json

      - name: 四分支 rpk 打包
        working-directory: band-qq
        run: |
          npm ci
          node tools/branch-release.js

      # ---------- 发布 ----------
      - name: 收集产物
        run: |
          mkdir -p release-assets
          find android-sync/app/build/outputs/apk -name "*.apk" -exec cp {} release-assets/ \;
          cp band-qq/dist-branch/*.rpk release-assets/
          ls -la release-assets/

      - name: 上传构建产物（artifact 存档）
        uses: actions/upload-artifact@v4
        with:
          name: bandqq-release-assets
          path: release-assets/*
          retention-days: 30
          if-no-files-found: error

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
