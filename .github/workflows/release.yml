# BandQQ Release —— 打 tag（v*）自动构建正式包并发 GitHub Release
#
# 触发：
#   git tag v2.25.1 && git push origin v2.25.1   → 构建并发版
#   手动 workflow_dispatch                        → 只出包存 artifact，不发 Release
#
# 版本校验：tag 必须与 android-sync/app/build.gradle.kts 的 versionName 一致，防止发错版本。
# 构建链（v2.25.1 起）：AGP 9.0.1 + Gradle 9.1.0 + JDK 17（原生 platforms;android-37.0，零补丁）。
# 产物（改名脚本统一为 bandqq-<版本>-<flavor/分支>.apk/.rpk）：
#   bandqq-<版本>-bundled.apk      胖包（内嵌引擎）
#   bandqq-<版本>-companion.apk    瘦包（伴侣版）
#   bandqq-{band,bandpro,xiaomis,redmiwatch}-<版本>.rpk  四分支快应用包

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    name: 构建正式包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tag 与 versionName 一致性校验
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[0-9.]+' android-sync/app/build.gradle.kts | head -1)
          echo "versionName=$V, tag=${GITHUB_REF}"
          if [ "${GITHUB_REF}" != "refs/tags/v${V}" ]; then
            echo "::error::tag ${GITHUB_REF} 与 versionName v${V} 不一致，请先对齐 app/build.gradle.kts"
            exit 1
          fi

      # ---------- APK ----------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 SDK 组件
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          yes | "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0" "build-tools;35.0.0" "platform-tools" >/dev/null
          [ -d "$ANDROID_HOME/platforms/android-37.0" ] && echo "platforms;android-37.0 ok"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: 单元测试 + 双 flavor Release 出包
        working-directory: android-sync
        run: gradle --no-daemon --max-workers=2 test assembleBundledRelease assembleCompanionRelease

      # ---------- rpk ----------
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: band-qq/package-lock.json

      - name: 四分支 rpk 打包
        working-directory: band-qq
        run: |
          npm ci
          node tools/branch-release.js

      # ---------- 发布 ----------
      - name: 统一改名并收集产物
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[0-9.]+' android-sync/app/build.gradle.kts | head -1)
          mkdir -p release-assets
          for f in android-sync/app/build/outputs/apk/*/release/*.apk; do
            flavor=$(basename "$(dirname "$(dirname "$f")")")
            cp "$f" "release-assets/bandqq-${V}-${flavor}.apk"
          done
          cp band-qq/dist-branch/*.rpk release-assets/
          ls -la release-assets/

      # v2.26.1：生成 SHA256 校验和随 Release 发布。
      # 背景：v2.25.1 胖包（80MB）用户报“解析包时出现问题”，本地 apksigner/aapt2/逐字节 CRC 对比
      # 证明 CI 产物完全合法（签名有效、清单/arsc 与历版可用包逐字节同构、.so 16KB 对齐），
      # 最大嫌疑是手机端大文件下载截断。有了 SHA256SUMS.txt，用户可先校验再安装，截断包不再无从対证。
      - name: 生成 SHA256 校验和
        run: |
          cd release-assets
          sha256sum bandqq-*.apk bandqq-*.rpk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 上传构建产物（artifact 存档）
        uses: actions/upload-artifact@v4
        with:
          name: bandqq-release-assets
          path: release-assets/*
          retention-days: 30
          if-no-files-found: error

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## 下载后请先校验再安装（尤其 80MB 胖包）

            手机端直接从 GitHub 下载大文件容易被截断，截断包安装必报 **“解析包时出现问题”**。
            附件提供 `SHA256SUMS.txt`，安装前建议校验：

            ```
            # PC 端：
            sha256sum -c SHA256SUMS.txt
            # 或手机端用任一「文件校验/MD5 校验」类工具比对下方哈希
            ```

            若哈希不一致 → 重新下载（可换网络/镜像）；若哈希一致仍报解析失败 → 请反馈机型与 Android 版本。
