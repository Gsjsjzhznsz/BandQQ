# BandQQ Release —— 打 tag（v*）自动构建正式包并发 GitHub Release
#
# 触发：
#   git tag v2.25.1 && git push origin v2.25.1   → 构建并发版
#   手动 workflow_dispatch                        → 只出包存 artifact，不发 Release
#
# 版本校验：tag 必须与 android-sync/app/build.gradle.kts 的 versionName 一致，防止发错版本。
# 产物（与历史 Release 资产一致）：
#   bandqq-<版本>-bundled.apk      胖包（内嵌引擎）
#   bandqq-<版本>-companion.apk    瘦包（伴侣版）
#   bandqq-{band,bandpro,xiaomis,redmiwatch}-<版本>.rpk  四分支快应用包

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    name: 构建正式包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tag 与 versionName 一致性校验
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[0-9.]+' android-sync/app/build.gradle.kts | head -1)
          echo "versionName=$V, tag=${GITHUB_REF}"
          if [ "${GITHUB_REF}" != "refs/tags/v${V}" ]; then
            echo "::error::tag ${GITHUB_REF} 与 versionName v${V} 不一致，请先对齐 app/build.gradle.kts"
            exit 1
          fi

      # ---------- APK ----------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 配方（本地 e2e 验证，与 scripts/setup-buildenv.sh 同源思路）：
      # Google 官方 platform-37.0 zip 元数据自带笔误（<api-level>37.0 / Platform.Version=17），
      # AGP 8.13.2 按 hash 串 android-37 查平台必报 Failed to find target——四处补丁：
      #   package.xml: path=platforms;android-37.0→37 + <api-level>37.0→37（后者是根因）
      #   source.properties: ApiLevel 37.0→37 + Platform.Version 17→37
      # 四跑实测：镜像预装的 android-37 未修元数据，sdkmanager 认 AGP 不认。
      - name: 安装 SDK 并修复 android-37 元数据笔误
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          LOG="${RUNNER_TEMP}/sdk-install.log"
          yes | "$SDKM" --licenses >> "$LOG" 2>&1 || true
          yes | "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" >> "$LOG" 2>&1 || true
          P="$ANDROID_HOME/platforms"
          rm -rf "$P"/android-37.1 "$P"/android-37.2 "$P"/android-37.2-beta1 "$P"/android-37.2-beta2 "$P"/android-37.2-beta3
          if [ -d "$P/android-37.0" ]; then
            rm -rf "$P/android-37"
            mv "$P/android-37.0" "$P/android-37"
          fi
          if [ ! -d "$P/android-37" ]; then
            echo "sdkmanager 装包失败，走官方 zip 直装兜底"
            curl -sSL -o "${RUNNER_TEMP}/p37.zip" "https://dl.google.com/android/repository/platform-37.0_r02.zip"
            unzip -q "${RUNNER_TEMP}/p37.zip" -d "${RUNNER_TEMP}/p37"
            rm -rf "$P/android-37" "$P/android-37.0"
            mv "${RUNNER_TEMP}/p37/android-37.0" "$P/android-37"
            sed -i 's|AndroidVersion.ApiLevel=37\.0|AndroidVersion.ApiLevel=37|; s|Platform\.Version=17|Platform.Version=37|' "$P/android-37/source.properties"
            cat > "$P/android-37/package.xml" << 'XMLEOF'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?><ns2:repository xmlns:ns2="http://schemas.android.com/repository/android/common/02" xmlns:ns11="http://schemas.android.com/sdk/android/repo/repository2/03"><localPackage path="platforms;android-37" obsolete="false"><type-details xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:type="ns11:platformDetailsType"><api-level>37</api-level><codename></codename><extension-level>22</extension-level><base-extension>true</base-extension><layoutlib api="15"/></type-details><revision><major>2</major></revision><display-name>Android SDK Platform 37</display-name><uses-license ref="android-sdk-license"/></localPackage></ns2:repository>
          XMLEOF
          fi
          if [ -d "$P/android-37" ]; then
            # 覆盖为仓库内置的验证版注册表（本地 e2e 同 AGP 代码路径构建通过）：
            # 镜像/sdkmanager 不同版本写的 package.xml schema 元素可能被 AGP 8.13.2
            # 内置 sdklib XSD 校验静默拒收，导致 hash 查找失败
            cp "$GITHUB_WORKSPACE/.github/sdk/platforms-android-37.package.xml" "$P/android-37/package.xml"
            [ -f "$P/android-37/source.properties" ] && sed -i 's|AndroidVersion.ApiLevel=37\.0|AndroidVersion.ApiLevel=37|; s|Platform\.Version=17|Platform.Version=37|' "$P/android-37/source.properties"
            echo "--- package.xml 关键行 ---"
            grep -o 'path="[^"]*"' "$P/android-37/package.xml" | head -2 || true
            grep -o '<api-level>[^<]*</api-level>' "$P/android-37/package.xml" || true
            echo "--- source.properties ---"
            cat "$P/android-37/source.properties" || true
          fi
          echo "--- 校验 ---"
          ls "$P" | grep 37 || true
          [ -f "$P/android-37/android.jar" ] || { tail -40 "$LOG"; echo "::error::android-37 缺 android.jar"; exit 1; }
          grep -q '<api-level>37</api-level>' "$P/android-37/package.xml" || { echo "::error::package.xml api-level 未修正"; exit 1; }
          grep -q 'AndroidVersion.ApiLevel=37$' "$P/android-37/source.properties" || { echo "::error::source.properties 未修正"; exit 1; }
          echo "platform android-37 ready"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: 单元测试 + 双 flavor Release 出包
        working-directory: android-sync
        run: gradle --no-daemon --max-workers=2 --stacktrace test assembleBundledRelease assembleCompanionRelease

      # ---------- rpk ----------
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: band-qq/package-lock.json

      - name: 四分支 rpk 打包
        working-directory: band-qq
        run: |
          npm ci
          node tools/branch-release.js

      # ---------- 发布 ----------
      - name: 收集产物
        run: |
          mkdir -p release-assets
          find android-sync/app/build/outputs/apk -name "*.apk" -exec cp {} release-assets/ \;
          cp band-qq/dist-branch/*.rpk release-assets/
          ls -la release-assets/

      - name: 上传构建产物（artifact 存档）
        uses: actions/upload-artifact@v4
        with:
          name: bandqq-release-assets
          path: release-assets/*
          retention-days: 30
          if-no-files-found: error

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
